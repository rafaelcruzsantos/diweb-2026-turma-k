<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 03</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="" method="get">
        <div>
            <h1>Trabalhando com formulários</h1>

            <label for="nome">Nome</label> <br>
            <input type="text" name="nome" id="nome" 
                placeholder="Informe seu nome." size="50" required>
            <br><br>
            <hr>
            <p>Endereço</p>
            <label for="logradouro">Logradouro</label>
            <input type="text" name="logradouro" id="logradouro" 
                placeholder="Informe o logradouro." size="50" required>
            <br>
            
            <label for="numero">Número</label>
            <input type="text" name="numero" id="numero" 
                placeholder="Informe o número." size="10" required>
            
            <label for="complemento">Complemento</label>
            <input type="text" name="complemento" id="complemento" 
                placeholder="Informe o complemento." size="30"
                required> <br>
            
            <label for="bairro">Bairro</label>
            <input type="text" name="bairro" id="bairro" 
                placeholder="Informe o bairro." size="30" required> <br>
            
            <label for="cidade">Cidade</label>
            <input type="text" name="cidade" id="cidade" 
                placeholder="Informe a cidade." size="30" required> <br>
            
            <label for="cep">CEP</label>
            <input type="text" name="cep" id="cep" 
                placeholder="Informe o cep." size="10" required>
            
            <label for="uf">UF</label>
            <input type="text" name="uf" id="uf" 
                placeholder="Informe a uf." size="5" required>

            <br><br>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
